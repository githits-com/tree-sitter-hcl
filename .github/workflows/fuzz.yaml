name: fuzz

on:
  push:
    branches: [main]
    paths:
      - src/scanner.c
      - src/identifier_ranges.h
      - dialects/*/src/scanner.c
      - dialects/*/src/identifier_ranges.h
  pull_request:
    paths:
      - src/scanner.c
      - src/identifier_ranges.h
      - dialects/*/src/scanner.c
      - dialects/*/src/identifier_ranges.h

jobs:
  fuzz:
    name: Parser fuzzing
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: [".", "dialects/terraform"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run fuzzer
        uses: tree-sitter/fuzz-action@v4
        with:
          directory: ${{matrix.directory}}
